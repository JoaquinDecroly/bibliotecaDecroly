$kind: http-request
url: "{{baseUrl}}/api/categorias/{{categoriaId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "ficción",
      "descripcion": "Nombre que ya tiene otra categoría"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código de estado 409", function () {
          pm.response.to.have.status(409);
      });
      pm.test("El error es un ProblemDetail", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/problem+json");
          pm.expect(pm.response.json().status).to.eql(409);
      });
    language: text/javascript
order: 9000
