$kind: http-request
url: "{{baseUrl}}/api/categorias/{{categoriaId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Teatro Postman",
      "descripcion": "Descripción modificada"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código de estado 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("La descripción se ha modificado", function () {
          pm.expect(pm.response.json().descripcion).to.eql("Descripción modificada");
      });
    language: text/javascript
order: 8000
