$kind: http-request
url: "{{baseUrl}}/api/categorias/{{categoriaId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código de estado 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Es la categoría creada", function () {
          pm.expect(pm.response.json().nombre).to.eql("Teatro Postman");
      });
    language: text/javascript
order: 6000
