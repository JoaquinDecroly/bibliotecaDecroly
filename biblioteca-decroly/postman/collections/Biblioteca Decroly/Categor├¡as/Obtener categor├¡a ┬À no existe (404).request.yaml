$kind: http-request
url: "{{baseUrl}}/api/categorias/{{idInexistente}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código de estado 404", function () {
          pm.response.to.have.status(404);
      });
      pm.test("El error es un ProblemDetail", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/problem+json");
          pm.expect(pm.response.json().status).to.eql(404);
      });
    language: text/javascript
order: 7000
