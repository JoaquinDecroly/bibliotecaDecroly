$kind: http-request
url: "{{baseUrl}}/api/libros/{{libroId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "isbn": "9788491050292",
      "titulo": "Don Quijote (edición revisada)",
      "autor": "Miguel de Cervantes",
      "anioPublicacion": 1605,
      "ejemplares": 8,
      "categoriaId": {{categoriaId}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código de estado 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Se actualizan los ejemplares y los disponibles", function () {
          const libro = pm.response.json();
          pm.expect(libro.titulo).to.eql("Don Quijote (edición revisada)");
          pm.expect(libro.ejemplares).to.eql(8);
          pm.expect(libro.disponibles).to.eql(8);
      });
    language: text/javascript
order: 14000
