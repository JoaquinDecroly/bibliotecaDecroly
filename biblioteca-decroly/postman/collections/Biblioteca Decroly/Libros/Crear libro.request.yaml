$kind: http-request
url: "{{baseUrl}}/api/libros"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "isbn": "9788491050292",
      "titulo": "Don Quijote de la Mancha",
      "autor": "Miguel de Cervantes",
      "anioPublicacion": 1605,
      "ejemplares": 5,
      "categoriaId": {{categoriaId}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código de estado 201", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Guarda el id del libro creado", function () {
          const libro = pm.response.json();
          pm.expect(libro.id).to.be.a("number");
          pm.collectionVariables.set("libroId", libro.id);
      });
      pm.test("Al crear, disponibles = ejemplares", function () {
          const libro = pm.response.json();
          pm.expect(libro.ejemplares).to.eql(5);
          pm.expect(libro.disponibles).to.eql(5);
      });
    language: text/javascript
order: 4000
