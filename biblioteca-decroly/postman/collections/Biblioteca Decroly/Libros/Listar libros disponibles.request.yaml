$kind: http-request
url: "{{baseUrl}}/api/libros/disponibles"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código de estado 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Todos tienen algún ejemplar disponible", function () {
          pm.response.json().forEach(function (libro) {
              pm.expect(libro.disponibles).to.be.above(0);
          });
      });
    language: text/javascript
order: 3000
