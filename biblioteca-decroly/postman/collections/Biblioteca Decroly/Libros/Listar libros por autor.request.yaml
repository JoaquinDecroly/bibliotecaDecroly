$kind: http-request
url: "{{baseUrl}}/api/libros?autor={{autor}}"
method: GET
queryParams:
  autor: "{{autor}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código de estado 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Todos los libros contienen el autor buscado (sin distinguir mayúsculas)", function () {
          const libros = pm.response.json();
          const autor = pm.collectionVariables.get("autor").toLowerCase();
          pm.expect(libros).to.be.an("array").that.is.not.empty;
          libros.forEach(function (libro) {
              pm.expect(libro.autor.toLowerCase()).to.include(autor);
          });
      });
    language: text/javascript
order: 2000
