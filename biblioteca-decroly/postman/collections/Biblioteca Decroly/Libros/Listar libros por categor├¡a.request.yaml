$kind: http-request
url: "{{baseUrl}}/api/categorias/{{categoriaId}}/libros"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código de estado 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Incluye el libro creado", function () {
          const ids = pm.response.json().map(function (libro) { return libro.id; });
          pm.expect(ids).to.include(Number(pm.collectionVariables.get("libroId")));
      });
    language: text/javascript
order: 12000
