$kind: http-request
url: "{{baseUrl}}/api/libros/{{libroId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código de estado 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Es el libro creado", function () {
          pm.expect(pm.response.json().isbn).to.eql("9788491050292");
      });
    language: text/javascript
order: 10000
